# =============================================================================
# RemoteHelpDesk — Nginx Reverse Proxy Configuration (Production)
# =============================================================================
# This configuration assumes:
#   - Go backend (RemoteHelpDesk) listens on the compatibility service at http://agent-desk:8083
#   - Next.js frontend listens on http://nextjs:3000
#   - TLS certificates are mounted at /etc/nginx/certs/
#
# IMPORTANT: Replace the following before production use:
#   - server_name: your actual domain
#   - ssl_certificate / ssl_certificate_key: path to actual certs
#   - ssl_stapling responders if needed
# =============================================================================

# Upstream definitions
upstream backend {
    zone backend 64k;
    server agent-desk:8083 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream frontend {
    zone frontend 64k;
    server nextjs:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/remotehelpdesk-branding levels=1:2 keys_zone=rhd_branding:20m max_size=256m inactive=30d use_temp_path=off;

# ============================================================================
# HTTP → HTTPS redirect
# ============================================================================
server {
    listen 80;
    server_name app.remotehelpdesk.com staging.remotehelpdesk.com;
    return 301 https://$server_name$request_uri;
}

# ============================================================================
# HTTPS server
# ============================================================================
server {
    listen 443 ssl http2;
    server_name app.remotehelpdesk.com;

    # -------------------------------------------------------------------------
    # TLS Configuration
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # Modern TLS configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' https://meet.jit.si;" always;

    # -------------------------------------------------------------------------
    # Gzip Compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/octet-stream
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # WebSocket API Proxy (must precede the generic /api/ location)
    # -------------------------------------------------------------------------
    location ^~ /api/ws/ {
        access_log off;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # API Proxy (Go Backend)
    # -------------------------------------------------------------------------
    # Internal control-plane endpoints are scraped/called directly on the
    # backend network and must never be exposed through the public reverse proxy.
    location = /api/mcp {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    # Tenant logos use immutable asset IDs, so a replacement produces a new URL.
    location ^~ /api/tenant-branding/logo/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache rhd_branding;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Branding-Cache $upstream_cache_status always;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;

        # CORS headers for preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # -------------------------------------------------------------------------
    # Legacy WebSocket proxy retained for old clients.
    # -------------------------------------------------------------------------
    location ^~ /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (long-lived connections)
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Static Assets (with long-term caching)
    # -------------------------------------------------------------------------
    location ^~ /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Aggressive caching for fingerprinted assets
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location ^~ /_next/data/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location ^~ /static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location = /images/tenants/odt/onward-ai-scheduled-intelligence-v1.jpg {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location ^~ /images/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location ^~ /sdk/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Favicon & Robots
    # -------------------------------------------------------------------------
    location = /favicon.ico {
        proxy_pass http://frontend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://frontend;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Static-export App Router metadata/segment payloads are not fingerprinted
    # like chunk files, so keep them browser-cacheable but short lived.
    location ~* (^|/)__next[^/]*\.txt$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        access_log off;
    }

    location ~ ^/partner/meetings/([^/]+)/room$ {
        absolute_redirect off;
        return 302 /partner/meeting-room?meeting_id=$1&$args;
    }

    location ~ ^/partner/meetings/([^/]+)/([^/]+)$ {
        absolute_redirect off;
        return 302 /partner/meeting-room?meeting_id=$1&audience=$2&$args;
    }

    location ~ ^/partner/tickets/([0-9]+)$ {
        absolute_redirect off;
        return 302 /partner/ticket-detail?collaboration_id=$1;
    }

    # -------------------------------------------------------------------------
    # Frontend (SPA fallback — all other paths)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Deny access to hidden files
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive paths
    location ~ /(\.env|\.git|config\.yaml|config\.yml|composer\.json|node_modules) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================================
# Rate Limiting Zones (defined globally)
# ============================================================================
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

# ============================================================================
# Request body size limit
# ============================================================================
client_max_body_size 50m;
