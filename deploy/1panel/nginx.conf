proxy_cache_path /var/cache/nginx/remotehelpdesk-storage levels=1:2 keys_zone=rhd_storage:20m max_size=512m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/remotehelpdesk-branding levels=1:2 keys_zone=rhd_branding:20m max_size=256m inactive=30d use_temp_path=off;

map "$http_authorization$http_cookie$query_string$http_range" $rhd_storage_cache_bypass {
    default 1;
    "" 0;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/octet-stream
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;

    etag on;
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location = /health {
        access_log off;
        proxy_pass http://api:8083/api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/mcp {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location ^~ /api/ws/ {
        access_log off;
        proxy_pass http://api:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /api/third/jitsi/transcription/ws/ {
        proxy_pass http://api:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Tenant logos use immutable asset IDs, so a replacement produces a new URL.
    location ^~ /api/tenant-branding/logo/ {
        proxy_pass http://api:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache rhd_branding;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Branding-Cache $upstream_cache_status always;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://api:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    location ^~ /storage/ {
        proxy_pass http://api:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache rhd_storage;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $rhd_storage_cache_bypass;
        proxy_no_cache $rhd_storage_cache_bypass;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, immutable, max-age=2592000" always;
        add_header X-Storage-Cache $upstream_cache_status always;
        access_log off;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location ^~ /_next/data/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location = /images/tenants/odt/onward-ai-scheduled-intelligence-v1.jpg {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location ^~ /sdk/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Static-export App Router metadata/segment payloads are not fingerprinted
    # like chunk files, so keep them browser-cacheable but short lived.
    location ~* (^|/)__next[^/]*\.txt$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        access_log off;
    }

    # Cache common static assets with a moderate TTL. Hashed `_next/static`
    # files still get the longer immutable policy above, while HTML stays
    # no-cache so deploys pick up fresh pages quickly.
    location ~* \.(?:css|js|mjs|map|json|webmanifest|wasm|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Removed early root-level management/workbench flows. Keep these paths from
    # being revived by the SPA fallback now that the productized portals live
    # under /enterprise, /customer, /partner, /platform, and /dashboard.
    location = /access {
        return 404;
    }

    location ^~ /access/ {
        return 404;
    }

    location = /knowledge {
        return 404;
    }

    location ^~ /knowledge/ {
        return 404;
    }

    location = /products {
        return 404;
    }

    location ^~ /products/ {
        return 404;
    }

    location = /reports {
        return 404;
    }

    location ^~ /reports/ {
        return 404;
    }

    location = /settings {
        return 404;
    }

    location ^~ /settings/ {
        return 404;
    }

    location = /ticket-workbench {
        return 404;
    }

    location ^~ /ticket-workbench/ {
        return 404;
    }

    location = /tickets {
        return 404;
    }

    location ^~ /tickets/ {
        return 404;
    }

    location = /workbench {
        return 404;
    }

    location ^~ /workbench/ {
        return 404;
    }

    # Runtime IDs cannot be pre-rendered by the static Next.js export. Keep
    # legacy detail URLs recoverable and hand them to the flat portal routes.
    location ~ ^/enterprise/workflow/([0-9]+)$ {
        absolute_redirect off;
        return 302 /enterprise/workflow?workflowId=$1&$args;
    }

    location ~ ^/enterprise/workflow/[^/.]+$ {
        absolute_redirect off;
        return 302 /enterprise/workflow;
    }

    location ~ ^/enterprise/ai/([0-9]+)$ {
        absolute_redirect off;
        return 302 /enterprise/ai?agentId=$1&$args;
    }

    location ~ ^/enterprise/ai/[^/.]+$ {
        absolute_redirect off;
        return 302 /enterprise/ai;
    }

    location ~ ^/enterprise/products/([0-9]+)$ {
        absolute_redirect off;
        return 302 /enterprise/products?product_id=$1&$args;
    }

    location ~ ^/enterprise/products/[^/.]+$ {
        absolute_redirect off;
        return 302 /enterprise/products;
    }

    location ~ ^/enterprise/tickets/([0-9]+)$ {
        absolute_redirect off;
        return 302 /enterprise/ticket-workbench?ticket_id=$1&$args;
    }

    location ~ ^/enterprise/tickets/[^/.]+$ {
        absolute_redirect off;
        return 302 /enterprise/tickets;
    }

    location ~ ^/enterprise/meetings/([^/]+)/room$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        rewrite ^/enterprise/meetings/([^/]+)/room$ /enterprise/meeting-room?meeting_id=$1&$args last;
    }

    location ~ ^/partner/meetings/([^/]+)/room$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        rewrite ^/partner/meetings/([^/]+)/room$ /partner/meeting-room?meeting_id=$1&$args last;
    }

    location ~ ^/partner/meetings/([^/]+)/([^/]+)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        rewrite ^/partner/meetings/([^/]+)/([^/]+)$ /partner/meeting-room?meeting_id=$1&audience=$2&$args last;
    }

    location ~ ^/partner/tickets/([0-9]+)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        absolute_redirect off;
        return 302 /partner/ticket-detail?collaboration_id=$1;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
