name: helpdesk-antivirus

services:
  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    environment:
      TZ: UTC
      FRESHCLAM_CHECKS: "12"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_AlertBrokenMedia: "yes"
      CLAMD_CONF_AlertBrokenExecutables: "yes"
      CLAMD_CONF_MaxScanSize: "100M"
      CLAMD_CONF_MaxFileSize: "20M"
      CLAMD_CONF_StreamMaxLength: "25M"
      CLAMD_CONF_MaxRecursion: "5"
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_MaxScanTime: "10000"
      CLAMD_CONF_MaxThreads: "4"
      CLAMD_CONF_MaxQueue: "8"
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav-signatures:/var/lib/clamav
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  clamav-signatures:
