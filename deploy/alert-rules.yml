# =============================================================================
# RemoteHelpDesk — Prometheus Alert Rules
# =============================================================================
#
# These rules are loaded by Prometheus (prometheus.yml -> rule_files).
# They alert on common failure modes:
#   - High error rate (5xx responses > 5% over 5 min)
#   - High latency (p95 > 2s)
#   - Service downtime
#   - Memory pressure
#   - Connection pool exhaustion
#   - Redis connectivity
#
# IMPORTANT: Adjust thresholds based on your production baseline before
# deploying.  Notifications require an Alertmanager configured separately.
# =============================================================================

groups:
  - name: remotehelpdesk
    interval: 30s
    rules:

      # ======================================================================
      # Application-Level Alerts
      # ======================================================================

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 5%)."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High API latency"
          description: "p95 response latency is {{ $value }}s over the last 5 minutes (threshold: 2s)."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "Instance {{ $labels.instance }} of job {{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: ApplicationDependencyDown
        expr: application_dependency_up == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Application dependency {{ $labels.dependency }} is unavailable"
          description: "The latest readiness checks for {{ $labels.dependency }} have failed for more than 2 minutes."

      - alert: ApplicationDependencySlow
        expr: application_dependency_check_duration_seconds > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Application dependency {{ $labels.dependency }} is slow"
          description: "Readiness checks for {{ $labels.dependency }} take {{ $value }} seconds."

      - alert: AIReplyJobsFailing
        expr: ai_reply_jobs_failed_recent_total > 0
        for: 2m
        labels:
          severity: critical
          team: ai-runtime
        annotations:
          summary: "AI replies are exhausting retries"
          description: "{{ $value }} AI reply jobs failed permanently in the last hour."

      - alert: AIReplyQueueBacklog
        expr: ai_reply_jobs_pending_total > 20
        for: 5m
        labels:
          severity: warning
          team: ai-runtime
        annotations:
          summary: "AI reply queue is backing up"
          description: "{{ $value }} AI reply jobs are waiting to run or retry."

      - alert: TicketSLABreach
        expr: tickets_sla_overdue_total > 0
        for: 2m
        labels:
          severity: critical
          team: service-desk
        annotations:
          summary: "Open tickets have breached SLA"
          description: "{{ $value }} open tickets are past their SLA due time."

      - alert: UnassignedTicketBacklog
        expr: tickets_unassigned_open_total > 5
        for: 15m
        labels:
          severity: warning
          team: service-desk
        annotations:
          summary: "Tickets remain unassigned"
          description: "{{ $value }} open tickets are waiting in product team pools."

      - alert: DatabaseBackupStale
        expr: (time() - remotehelpdesk_database_backup_last_success_unixtime > 90000) or absent(remotehelpdesk_database_backup_last_success_unixtime)
        for: 10m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Database backup is stale"
          description: "No successful database backup has been recorded for more than 25 hours."

      - alert: RestoreDrillStale
        expr: (time() - remotehelpdesk_restore_drill_last_success_unixtime > 691200) or absent(remotehelpdesk_restore_drill_last_success_unixtime)
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Database restore drill is stale"
          description: "No successful isolated restore drill has been recorded for more than 8 days."

      - alert: HighMemoryUsage
        expr: go_memstats_alloc_bytes / go_memstats_sys_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High Go memory usage"
          description: "Go process memory allocation is at {{ $value | humanizePercentage }} (threshold: 90%)."

      - alert: HighGoroutines
        expr: go_goroutines > 1000
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High number of goroutines"
          description: "{{ $value }} goroutines running (threshold: 1000)."

      - alert: RealtimeConnectionsDropped
        expr: sum(realtime_websocket_connections) == 0 and sum(increase(http_requests_total{route=~"/api/(conversation|message)/.*"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Realtime connections dropped while chat traffic is active"
          description: "Chat APIs are receiving traffic but no WebSocket clients have remained connected for 5 minutes."

      - alert: DBConnectionPoolExhausted
        expr: db_connection_pool_active / db_connection_pool_max > 0.9
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Database connection pool exhausted"
          description: "Active connections are at {{ $value | humanizePercentage }} of the pool maximum (threshold: 90%)."

      - alert: SlowDatabaseQueries
        expr: rate(db_query_duration_seconds_sum[5m]) / rate(db_query_duration_seconds_count[5m]) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Slow database queries"
          description: "Average query duration is {{ $value }}s over the last 5 minutes (threshold: 1s)."

      - alert: HighGCThroughput
        expr: rate(go_gc_duration_seconds_sum[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High GC activity"
          description: "GC is consuming {{ $value }}s/s of CPU time."

      # ======================================================================
      # Infrastructure-Level Alerts
      # ======================================================================

      - alert: RedisConnectionFailure
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redis connection failure"
          description: "Redis instance {{ $labels.instance }} is unreachable."

      - alert: RedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is at {{ $value | humanizePercentage }} of max (threshold: 85%)."

      - alert: RedisMissingKeys
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.9
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis cache hit rate low"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 90%)."

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable."

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "PostgreSQL connections high"
          description: "{{ $value | humanizePercentage }} of max connections in use (threshold: 85%)."

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 60
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "PostgreSQL replication lag"
          description: "Replication lag is {{ $value }} seconds (threshold: 60s)."

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} > 0.85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is at {{ $value | humanizePercentage }} (threshold: 85%)."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is at {{ $value }}% (threshold: 80%)."

      - alert: OutOfMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Out of memory on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} memory available (threshold: 10%)."

      - alert: ProcessFailing
        expr: process_open_fds / process_max_fds > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Process approaching file descriptor limit"
          description: "{{ $labels.instance }} is using {{ $value | humanizePercentage }} of max file descriptors."
