[project]
name = "onward-ai-phone-agent"
version = "0.1.0"
description = "Python voice agent for SIP phone intake and Go ticket creation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
local-voice = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "faster-whisper>=1.1,<2",
  "silero-vad>=5,<7",
  "kokoro>=0.9,<1",
  "misaki[zh]>=0.9,<1",
]
local-mic = ["sounddevice>=0.5,<1"]

test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ai_phone_agent*"]
