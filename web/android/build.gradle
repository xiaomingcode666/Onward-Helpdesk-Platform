// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://github.com/jitsi/jitsi-maven-repository/raw/master/releases' }
    }
}

configurations {
    bundletool
}

dependencies {
    bundletool 'com.android.tools.build:bundletool:1.18.1'
}

def releaseBundle = layout.projectDirectory.file('app/build/outputs/bundle/release/app-release.aab')
def bundletoolOutput = new ByteArrayOutputStream()

tasks.register('validateReleaseBundle', JavaExec) {
    group = 'verification'
    description = 'Validates the signed release Android App Bundle with bundletool.'
    dependsOn ':app:bundleRelease'
    classpath = configurations.bundletool
    mainClass = 'com.android.tools.build.bundletool.BundleToolMain'
    args 'validate', "--bundle=${releaseBundle.asFile.absolutePath}"
    standardOutput = bundletoolOutput

    doLast {
        logger.lifecycle("Validated Android App Bundle: ${releaseBundle.asFile}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
