name: Deploy

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/remotehelpdesk
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      image_lancedb: ${{ steps.meta-lancedb.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "Secret DOCKERHUB_USERNAME is required" >&2
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "Secret DOCKERHUB_TOKEN is required" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=long
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Extract LanceDB Docker metadata
        id: meta-lancedb
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=long
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          flavor: |
            suffix=-lancedb,onlatest=true

      - name: Build and push (standard)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (LanceDB)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app-lancedb
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-lancedb.outputs.tags }}
          labels: ${{ steps.meta-lancedb.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.remotehelpdesk.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add staging server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via Docker Compose
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            set -e
            cd /opt/remotehelpdesk

            export IMAGE_NAME='${{ env.IMAGE_NAME }}'
            export IMAGE_TAG='${{ github.sha }}'

            previous_image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose -f docker-compose.prod.yml ps -q agent-desk)" 2>/dev/null || true)
            if [ -n "$previous_image" ]; then
              printf '%s\n' "$previous_image" > .staging-rollback-image
            fi

            echo "Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull agent-desk nextjs

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm agent-desk ./remotehelpdesk -migrate

            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --wait

            echo "Deployment to staging complete!"
          EOF

      - name: Health check
        run: |
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://staging.remotehelpdesk.com/api/health/ready || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: HTTP $status, waiting 10s..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ROLLBACK'
            set -e
            cd /opt/remotehelpdesk
            previous_image=$(cat .staging-rollback-image 2>/dev/null || true)
            if [ -z "$previous_image" ]; then
              echo "No previous staging image was recorded." >&2
              exit 1
            fi
            export IMAGE_NAME="${previous_image%:*}"
            export IMAGE_TAG="${previous_image##*:}"
            docker compose -f docker-compose.prod.yml up -d --wait agent-desk nextjs nginx
            echo "Staging rollback completed: ${previous_image}"
          ROLLBACK
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.remotehelpdesk.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add production server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Notify deployment start
        run: |
          curl -s -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"text": "Starting production deployment of RemoteHelpDesk: '"${{ github.sha }}"'"}'

      - name: Deploy via Docker Compose
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            set -e
            cd /opt/remotehelpdesk

            export IMAGE_NAME='${{ env.IMAGE_NAME }}'
            export IMAGE_TAG='${{ github.sha }}'

            previous_image=$(docker inspect --format '{{.Config.Image}}' "$(docker compose -f docker-compose.prod.yml ps -q agent-desk)" 2>/dev/null || true)
            if [ -n "$previous_image" ]; then
              printf '%s\n' "$previous_image" > .production-rollback-image
            fi

            echo "Backing up and verifying database restore before deployment..."
            mkdir -p /data/remotehelpdesk/backups
            COMPOSE_FILE=docker-compose.prod.yml PG_TOOL_MODE=docker BACKUP_RETENTION_COUNT=30 \
              BACKUP_METRICS_FILE=/data/remotehelpdesk/metrics/remotehelpdesk_backup.prom \
              ./scripts/backup-db.sh /data/remotehelpdesk/backups
            backup_file=$(ls -1t /data/remotehelpdesk/backups/cs_ai_agent_*.dump | head -n 1)
            COMPOSE_FILE=docker-compose.prod.yml PG_TOOL_MODE=docker \
              RESTORE_DRILL_METRICS_FILE=/data/remotehelpdesk/metrics/remotehelpdesk_restore_drill.prom \
              ./scripts/drill-db-restore.sh "$backup_file"

            echo "Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull agent-desk nextjs

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm agent-desk ./remotehelpdesk -migrate

            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --wait

            echo "Deployment to production complete!"
          EOF

      - name: Health check
        run: |
          echo "Running comprehensive health check..."
          for i in $(seq 1 36); do
            # Check API health
            api_status=$(curl -s -o /dev/null -w "%{http_code}" https://app.remotehelpdesk.com/api/health/ready || echo "000")
            # Check frontend
            web_status=$(curl -s -o /dev/null -w "%{http_code}" https://app.remotehelpdesk.com/ || echo "000")

            if [ "$api_status" = "200" ] && [ "$web_status" = "200" ]; then
              echo "All services healthy!"
              exit 0
            fi

            echo "Attempt $((i+1)): API=$api_status Web=$web_status, waiting 10s..."
            sleep 10
          done

          echo "Health check failed — initiating rollback..."
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ROLLBACK'
            set -e
            cd /opt/remotehelpdesk
            previous_image=$(cat .production-rollback-image 2>/dev/null || true)
            if [ -z "$previous_image" ]; then
              echo "No previous production image was recorded." >&2
              exit 1
            fi
            export IMAGE_NAME="${previous_image%:*}"
            export IMAGE_TAG="${previous_image##*:}"
            docker compose -f docker-compose.prod.yml up -d --wait agent-desk nextjs nginx
            echo "Rollback completed: ${previous_image}"
          ROLLBACK
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          curl -s -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"text": "Production deployment of RemoteHelpDesk succeeded: '"${{ github.sha }}"'"}'

      - name: Notify deployment failure
        if: failure()
        run: |
          curl -s -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"text": "Production deployment of RemoteHelpDesk FAILED: '"${{ github.sha }}"'"}'
